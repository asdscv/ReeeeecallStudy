name: Deploy Mobile (EAS Update / Build)

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy mode'
        required: true
        default: 'auto'
        type: choice
        options: [auto, ota, native]

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Decide: OTA (eas update) vs full native build
  # Heuristic: native build required if android/ios/app.json/app.config.js
  # changed. Otherwise OTA is safe.
  # ─────────────────────────────────────────────────────────────────────
  decide:
    name: Decide deploy mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.choose.outputs.mode }}
      has_expo_token: ${{ steps.token.outputs.has_token }}
    steps:
      - id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::EXPO_TOKEN secret not configured — mobile deploy will be skipped."
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: choose
        run: |
          MANUAL="${{ github.event.inputs.mode }}"
          if [ "$MANUAL" = "ota" ] || [ "$MANUAL" = "native" ]; then
            echo "mode=$MANUAL" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -E '^packages/mobile/(android|ios|app\.json|app\.config\.js)' >/dev/null; then
            echo "mode=native" >> $GITHUB_OUTPUT
          else
            echo "mode=ota" >> $GITHUB_OUTPUT
          fi

  ota:
    name: EAS Update (OTA)
    needs: decide
    if: needs.decide.outputs.mode == 'ota' && needs.decide.outputs.has_expo_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA update
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Passed as an ENVIRONMENT VARIABLE, never interpolated into the script body.
          #
          # `MSG="${{ github.event.head_commit.message }}"` substituted the commit message into
          # the shell source before bash ever saw it, so the message was CODE. A release titled
          #     release: 적응형 학습 일정 + "더 하기" + 페이월 정정
          # closed the opening quote at `"더`, and bash tried to run the rest:
          #     하기 + 페이월 정정 (migs 181–186): command not found   (exit 127)
          # The whole deploy failed on a pair of quotation marks in a title.
          #
          # A message containing `$(...)` would not have failed — it would have RUN, on a runner
          # holding EXPO_TOKEN. Anyone who can land a commit could name it accordingly. Through
          # `env:` the value arrives as data and neither can happen.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Truncate to the first line: the CLI takes a one-line message.
          MSG=$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -1)
          # Fallback for workflow_dispatch (no head_commit) or empty message.
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --pretty=%s)
          fi
          if [ -z "$MSG" ]; then
            MSG="OTA update ${GITHUB_SHA::7}"
          fi
          eas update \
            --branch production \
            --environment production \
            --message "$MSG" \
            --non-interactive

  native-build:
    name: EAS Build + Submit
    needs: decide
    if: needs.decide.outputs.mode == 'native' && needs.decide.outputs.has_expo_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build (production, no-wait)
        working-directory: packages/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform all --profile production --non-interactive --no-wait
      # Submission is gated on a separate manual approval workflow:
      #   `.github/workflows/submit-mobile.yml`
