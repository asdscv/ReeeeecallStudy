name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 20

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: Lint + Typecheck (fast feedback)
  # ─────────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Strict gate — typecheck must pass for the whole web package.
      # Use `tsc -b` so project references (tsconfig.app.json, tsconfig.node.json)
      # are actually checked; plain `tsc --noEmit` on the root config is a no-op
      # because the root has `files: []` and only `references`.
      - name: Web typecheck
        run: pnpm --filter @reeeeecall/web exec tsc -b --noEmit

      # The Playwright suite is in no other tsconfig, so without this nothing ever
      # type-checked it and its fixtures drifted to `any`.
      - name: Web e2e typecheck
        run: pnpm --filter @reeeeecall/web typecheck:e2e

      # Strict gate. It was informational while develop carried 148 eslint errors;
      # those are cleared (6 were real defects, the rest missing types and
      # effect-driven state), so the escape hatch comes off and the debt cannot
      # silently return.
      - name: Web lint
        run: pnpm --filter @reeeeecall/web lint
      - name: Mobile typecheck (regression guard for marketplace scope)
        run: |
          set +e
          pnpm --filter @reeeeecall/mobile exec tsc --noEmit 2>&1 | tee /tmp/mobile-tsc.log
          # Pre-existing baseline errors are tolerated; new marketplace/acquire scope errors are not.
          if grep -E "(MarketplaceDetail|marketplace-store|acquireDeck|deck-store)" /tmp/mobile-tsc.log; then
            echo "::error::TypeScript error introduced in marketplace/acquire scope"
            exit 1
          fi
          exit 0

  # ─────────────────────────────────────────────────────────────────────
  # Job 1b: develop→main promotions must say their migrations were applied
  #
  # Merging to main auto-deploys web. If the schema lags the code, the app 404s on the new
  # RPCs for every user and nothing in CI goes red — the ordering rule lived only in a
  # runbook, i.e. in whoever remembered to open it.
  #
  # An attestation, not a measurement: production's version is not in git, and checking it
  # for real would mean putting a database credential in a PUBLIC repo's CI — the same
  # environment where a commit-message injection was found on 2026-08-03. See the script
  # header for the full argument.
  # ─────────────────────────────────────────────────────────────────────
  migration-promotion:
    name: Migration promotion gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison have to exist locally.
          fetch-depth: 0
      - name: Check migrations were applied before promoting
        env:
          # Via env, never interpolated into the script body — a PR description is attacker
          # controlled, and `${{ }}` inside `run:` makes it code (see deploy-mobile.yml).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash .github/scripts/check-migration-promotion.sh \
            "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests (vitest)
  # ─────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Strict gate — the whole suite. It used to be informational because develop
      # carried 75 failures and 6 suites that never loaded; those were harness
      # defects (mocks that never applied, missing test env, unusable localStorage),
      # not product debt, and they hid a real auth bug. Now that the suite is green
      # it gates, so the debt cannot come back silently.
      - name: Vitest — full suite
        working-directory: packages/web
        run: npx vitest run --reporter=verbose

      # The Cloudflare worker modules (SEO handlers, locale policy, sitemap, content
      # pipeline) are outside packages/*, so no job ran their 123 tests — the locale
      # policy's noindex/hreflang/sitemap guarantees had no CI guard at all.
      - name: Vitest — worker modules
        run: pnpm test:worker

      # Mobile's own i18n suite, which no job ran. `i18n-key-usage.test.ts` (in the web
      # suite above) reaches into packages/mobile and covers key parity, but NOT the four
      # things only this file checks: that every `{{x, spec}}` in a locale has an Intl-free
      # formatter registered (Hermes can ship without full ICU, and an unregistered spec
      # silently drops thousands separators); that counted strings have _one/_other where
      # the language inflects; that every namespace in `ns[]` is require()d for every
      # language; and the FAMILIES table for keys built by interpolation.
      #
      # It is a plain script (console.log + process.exit(1)), not vitest, so it gets its own
      # step. Run from packages/web because that is where `tsx` is installed — the test
      # resolves every path from `__dirname`, so the working directory does not matter.
      - name: i18n — mobile locale suite
        working-directory: packages/web
        run: npx tsx ../mobile/src/i18n/i18n.test.ts

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: packages/web/coverage
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: Real Supabase integration tests (atomic acquire flow, etc.)
  # ─────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: CLI 2.107.0 stopped granting default DML (SELECT/INSERT/UPDATE/
          # DELETE) to anon/authenticated on `db reset`, breaking integration grants
          # (e.g. acquire_listing → "permission denied for table deck_shares").
          # Prod + the migrations themselves are unaffected (verified); this keeps
          # the local test DB's role grants correct.
          version: 2.95.4
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (local stack via Docker)
        # Brings the stack up and applies all migrations (init schema → all RPCs).
        # Wrapped because this exact step 5xx'd six times in one afternoon; the
        # wrapper retries ONLY that signature and fails immediately on anything
        # else, so a broken migration still reports on the first attempt.
        run: bash .github/scripts/supabase-up.sh

      - name: Capture Supabase keys
        id: keys
        run: |
          ANON=$(supabase status -o json | jq -r .ANON_KEY)
          SVC=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)
          echo "anon=$ANON" >> $GITHUB_OUTPUT
          echo "svc=$SVC" >> $GITHUB_OUTPUT

      - name: Run integration suite
        env:
          SUPABASE_LOCAL_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.keys.outputs.svc }}
        # Run from repo root — vitest.config.ts resolves its include glob from
        # the cwd. Resolve the binary first and run once: the previous
        # `A || B` form re-ran the whole suite whenever a test failed, not just
        # when the binary was missing.
        run: |
          if [ -x ./node_modules/.bin/vitest ]; then
            VITEST=./node_modules/.bin/vitest
          elif [ -x packages/web/node_modules/.bin/vitest ]; then
            VITEST=packages/web/node_modules/.bin/vitest
          else
            echo "::error::vitest binary not found in root or packages/web"
            exit 1
          fi
          echo "using $VITEST"
          "$VITEST" run --config tests/integration/vitest.config.ts tests/integration

      - name: Stop Supabase
        if: always()
        run: supabase stop || true

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Architecture guard — domain layer must not import supabase
  # ─────────────────────────────────────────────────────────────────────
  arch-guard:
    name: Architecture Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run arch checks
        # tsx is a transitive devDep of @reeeeecall/web; resolve via the web package
        run: pnpm --filter @reeeeecall/web exec tsx ../../tools/check-arch.ts

  # ─────────────────────────────────────────────────────────────────────
  # Job 5: Migration safety — every migration must apply against fresh DB
  # ─────────────────────────────────────────────────────────────────────
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: CLI 2.107.0 stopped granting default DML (SELECT/INSERT/UPDATE/
          # DELETE) to anon/authenticated on `db reset`, breaking integration grants
          # (e.g. acquire_listing → "permission denied for table deck_shares").
          # Prod + the migrations themselves are unaffected (verified); this keeps
          # the local test DB's role grants correct.
          version: 2.95.4
      - name: Reset DB with all migrations
        # Same upstream-5xx wrapper as the Integration job — see the script header.
        run: bash .github/scripts/supabase-up.sh
      - name: Idempotency check — running reset twice should pass
        # Same wrapper as the bring-up. This step is not exempt from the flake — it
        # took a run down on 2026-08-02 with a storage-API timeout — and it retries
        # on the infrastructure signature ONLY, so a migration that genuinely is not
        # idempotent still fails on the first try.
        run: bash .github/scripts/supabase-up.sh reset-only
      - name: Stop
        if: always()
        run: supabase stop || true

  # ─────────────────────────────────────────────────────────────────────
  # Job 6: AI credit / metering money-logic regression suite
  #   The server-side AI generation wallet moves real money (free-tier
  #   accounting, atomic credit debit, idempotent grants/refunds), so it gets
  #   assertion coverage on every PR. Uses the lightweight plain-postgres
  #   pattern (bootstrap-auth shim → full migration chain → assertion SQL),
  #   the same one official-decks' migration-smoke proves out on the runner —
  #   no Docker supabase stack needed. ON_ERROR_STOP + ASSERT means any failed
  #   invariant aborts the job non-zero.
  # ─────────────────────────────────────────────────────────────────────
  ai-credit-tests:
    name: AI Credit Metering (postgres-15)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap auth/storage/extensions schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f .github/scripts/bootstrap-auth.sql

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "==> $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run AI credit / metering assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/ai_credit_metering_test.sql

      - name: Run AI cost / margin / pricing assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/ai_cost_margin_test.sql

      - name: Run AI metered smoke + net-zero + dry-run + reconcile assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/ai_metered_smoke_test.sql

      - name: Run goal-knowledge assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/goal_knowledge_test.sql

      - name: Run mastery-definition assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/mastery_definition_test.sql

      - name: Run quiz schema assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/quiz_schema_test.sql

      - name: Run quiz metering assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/quiz_metering_test.sql

      - name: Run quiz run/RPC assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/quiz_run_rpcs_test.sql

      - name: Run owned-card limit assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/card_limit_test.sql

      - name: Run owned-card limit smoke + net-zero + dry-run assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/card_limit_smoke_test.sql

      - name: Run owned-card limit INSERT-GUARD trigger + usage-detail assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/card_limit_guard_test.sql

      - name: Run over-cap SUBSCRIBED card study-lock assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/card_limit_sub_lock_test.sql

      - name: Run card-limit RLS hardening assertions (reactivation guard + deck-ownership)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/card_limit_rls_test.sql

      - name: Run payment edge-case hardening assertions (mig 144 — terminal guard / retire / clawback / transfer)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/payment_edgecase_test.sql

      - name: Run store-SKU catalog assertions (mig 151 — resolve / set / get_billing_products(platform) / unique-active)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/billing_sku_catalog_test.sql

      # This list is explicit, not a glob, so a new suite is invisible to CI until it
      # is added here — refund_policy_test.sql shipped in #320 and never ran.
      - name: Run refund channel + policy assertions (migs 156/157 — iOS revoke-only vs Play refundable, eligibility verdicts)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/refund_policy_test.sql

      - name: Run credit refund-guard assertions (mig 158 — refund-before-grant tombstone is actually readable)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/credit_refund_guard_test.sql

      - name: Run credit clawback REVERSAL assertions (mig 173 — REFUND_REVERSED restores exactly, tombstone stops blocking)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/credit_clawback_reversal_test.sql

      - name: Run sandbox isolation assertions (mig 159 — kill switch + sandbox never counts as money)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/sandbox_environment_test.sql

      - name: Run admin payment-list refund-status assertions (mig 175 — a refunded pack must not list as paid)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/admin_payment_refund_status_test.sql

      - name: Run session-override removal assertions (mig 176 — dead key gone, one-session-per-platform intact)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/session_override_removed_test.sql

      - name: Run growth-lever assertions (mig 177 — read path, setter round trips, refused bounds)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/admin_growth_levers_test.sql

      - name: Run public plan-limit assertions (mig 179 — public read, free-tier not per-user, no knob leak)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/public_plan_limits_test.sql

      - name: Run account-deletion assertions (mig 180 — blockers cleared, money retained, purge gated)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_test.sql

      - name: Run goal-workload assertions (mig 182 — learner's schedule not the publisher's, work owed)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/goal_workload_test.sql

      - name: Run append-plan assertions (mig 185 — "더 하기" adds without destroying)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/append_plan_test.sql

      # ── Learning engine (migs 165/167/168) ──────────────────────────────
      # These shipped with the learning-engine PR and were not wired here, so
      # they never ran on CI. Registered explicitly, like every suite above.
      - name: Run learning engine assertions (migs 165/167 — atomicity, idempotency, lifecycle vs apply_study_rating)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/learning_engine_test.sql

      - name: Run learning goal-link assertions (mig 172 — deck/concept entitlement, replace-all atomicity)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/learning_goal_links_test.sql

      - name: Run plan-study assertions (migs 187/188/189 — schedule+plan in one transaction, undo unwinds both, goal delete cascade)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/plan_study_rating_test.sql

      - name: Run study recommendation assertions (mig 174 — decisions survive regeneration, terminal states)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/study_recommendation_test.sql

      - name: Run AI remediation assertions (mig 168 — job classification, access, service-only persistence)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/ai_remediation_test.sql

      - name: Run learning engine SMOKE assertions (goal → plan → attempt → rollup → remediation → enrichment)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/learning_smoke_test.sql

      - name: Run learning engine NET-ZERO assertions (every rejected call changes nothing, quota included)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/learning_net_zero_test.sql

      # Runs last in this job: it reverts and re-applies migrations 165/167/168/169
      # against the throwaway service database to prove the rollback artifacts
      # leave zero residue, then restores them.
      - name: Run learning migration DRY RUN (apply → rollback → zero residue → restore)
        env:
          PGPASSWORD: postgres
          DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: ./scripts/dry-run-learning-migrations.sh
